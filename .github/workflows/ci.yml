name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run verify

  performance:
    name: Git overhead (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run benchmark:git

  package-smoke:
    name: Package smoke
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run smoke:package
      - run: npm pack --silent
      - if: runner.os == 'Windows'
        shell: pwsh
        run: npx.cmd --yes --package .\commit-discipline-mcp-0.1.0.tgz commit-discipline --help
      - if: runner.os == 'Windows'
        shell: cmd
        run: npx --yes --package .\commit-discipline-mcp-0.1.0.tgz commit-discipline --help
      - if: runner.os == 'Linux'
        shell: bash
        run: npx --yes --package ./commit-discipline-mcp-0.1.0.tgz commit-discipline --help
      - if: runner.os == 'macOS'
        shell: zsh {0}
        run: npx --yes --package ./commit-discipline-mcp-0.1.0.tgz commit-discipline --help
