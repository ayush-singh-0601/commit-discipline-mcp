name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run verify

  package-smoke:
    name: Package smoke
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run smoke:package
      - if: runner.os == 'Windows'
        shell: pwsh
        run: node bin/commit-discipline.js --help
      - if: runner.os == 'Windows'
        shell: cmd
        run: node bin\commit-discipline.js --help
      - if: runner.os == 'Linux'
        shell: bash
        run: node bin/commit-discipline.js --help
      - if: runner.os == 'macOS'
        shell: zsh {0}
        run: node bin/commit-discipline.js --help
